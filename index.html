<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Converter Laporan NOC-SA (Final Pro)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
  <style>
    body { background: #f0f2f5; padding: 50px; font-family: 'Segoe UI', sans-serif; }
    .upload-card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    .btn-primary { background: #004d99; border: none; padding: 12px; font-weight: bold; }
    #notif { font-weight: 500; margin-top: 15px; }
  </style>
</head>
<body>

<div class="container col-md-6">
  <div class="upload-card">
    <h4 class="text-center mb-4">UPLOAD MENTAHAN LAPORAN EXCEL</h4>
    
    <div class="mb-3">
      <label class="form-label fw-bold">File Excel Mentah</label>
      <input type="file" id="inputFile" class="form-control" accept=".xlsx, .xls, .csv">
    </div>

    <div class="row mb-3">
      <div class="col-6">
        <label class="form-label fw-bold">Shift</label>
        <select id="shift" class="form-select">
          <option value="Shift 1 (06.00 - 14.00)">Shift 1</option>
          <option value="Shift 2 (14.00 - 22.00)" selected>Shift 2</option>
          <option value="Shift 3 (22.00 - 06.00)">Shift 3</option>
        </select>
      </div>
      <div class="col-6">
        <label class="form-label fw-bold">Tanggal</label>
        <input type="date" id="tanggal" class="form-control">
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-6 mb-3 mb-md-0">
        <label class="form-label fw-bold">Jobdesk</label>
        <select id="jobdesk" class="form-select">
          <option value="Security Analyst" selected>Security Analyst</option>
          <option value="Service Desk">Service Desk</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label fw-bold">Petugas</label>
        <div class="input-group">
          <select id="namaPetugas" class="form-select"></select>
          <button class="btn btn-outline-secondary" type="button" id="btnCustomNama">+ Tambah</button>
        </div>
      </div>
    </div>

    <div id="customNamaWrapper" class="mb-3" style="display:none;">
      <label class="form-label small text-muted">Masukkan Nama Petugas Baru:</label>
      <div class="input-group input-group-sm">
        <input type="text" id="customNama" class="form-control" placeholder="Nama Lengkap">
        <button class="btn btn-success" type="button" id="btnApplyCustom">Simpan</button>
        <button class="btn btn-danger" type="button" id="btnCancelCustom">Batal</button>
      </div>
    </div>
    <div class="mb-4">

    <div class="mb-4">
      <label class="form-label fw-bold">Upload Tanda Tangan (Opsional)</label>
      <input type="file" id="uploadSignature" class="form-control" accept="image/png, image/jpeg, image/jpg">
      
      <div id="signaturePreviewContainer" class="mt-2" style="display: none; border: 2px dashed #cccccc; padding: 10px; border-radius: 10px; text-align: center; background: #fff;">
        <img id="signaturePreview" src="" alt="Preview Tanda Tangan" style="max-width: 100%; max-height: 80px;">
        <br>
        <button type="button" class="btn btn-sm btn-danger mt-2" id="clearSignatureUpload">Hapus Gambar</button>
      </div>
    </div>

    <button id="prosesBtn" class="btn btn-primary w-100">PROSES & DOWNLOAD HASIL AKHIR</button>
    <div id="notif" class="text-center small"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
