<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Converter Laporan NOC-SA (Filter Duplikat)</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container col-md-6">
      <div class="upload-card">
        <h4 class="text-center mb-4">UPLOAD MENTAHAN LAPORAN EXCEL</h4>

        <div class="mb-3">
          <label class="form-label fw-bold">1. File Excel Mentah</label>
          <input
            type="file"
            id="inputFile"
            class="form-control"
            accept=".xlsx, .xls, .csv"
          />
        </div>

        <div class="row mb-3">
          <div class="col-6">
            <label class="form-label fw-bold">2. Shift</label>
            <select id="shift" class="form-select">
              <option value="Shift 1 (06.00 - 14.00)">Shift 1</option>
              <option value="Shift 2 (14.00 - 22.00)" selected>Shift 2</option>
              <option value="Shift 3 (22.00 - 06.00)">Shift 3</option>
            </select>
          </div>
          <div class="col-6">
            <label class="form-label fw-bold">3. Tanggal</label>
            <input type="date" id="tanggal" class="form-control" />
          </div>
        </div>

        <button id="prosesBtn" class="btn btn-primary w-100">
          PROSES & DOWNLOAD HASIL AKHIR
        </button>
        <div id="notif" class="text-center small"></div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
